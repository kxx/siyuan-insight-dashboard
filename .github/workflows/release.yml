name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Build plugin
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: siyuan-insight-dashboard
          path: package.zip

      - name: Read plugin version
        id: plugin-version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: echo "version=$(node -p \"require('./plugin.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.plugin-version.outputs.version }}
          files: package.zip
          generate_release_notes: true
